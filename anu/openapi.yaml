openapi: 3.1.0
info:
  title: ANU API
  version: 0.1.0
  description: |
    Public API for ANU clients (phone and web). Sign in with a phone number and
    a one-time code, then create tasks and follow their steps.

    Every task route checks ownership on the server. A task that does not
    exist and a task owned by someone else both return 404.

    Internal routes under /internal are for the sandbox server only and are not
    described here.
servers:
  - url: http://127.0.0.1:8787
    description: Local development
security:
  - session: []
tags:
  - name: auth
  - name: me
  - name: tasks
  - name: workspace
  - name: agents
  - name: sessions

paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /v1/auth/code/request:
    post:
      tags: [auth]
      summary: Send a one-time code to a phone number
      description: |
        Codes have six digits and expire after five minutes. Requests are rate
        limited per phone number and per client address (by default 5 and 20
        per 15 minutes). When ANU_ENV is dev or test and OTP_SENDER is dev, the
        response includes `devCode`; in any other environment it never does.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: E.164 number. Spaces, dashes, dots, and parentheses are ignored.
                  example: "+12025550100"
      responses:
        "202":
          description: Code issued
          content:
            application/json:
              schema:
                type: object
                required: [expiresAt]
                properties:
                  expiresAt: { type: string, format: date-time }
                  devCode:
                    type: string
                    pattern: "^[0-9]{6}$"
                    description: Present only with the dev sender in dev or test.
        "400": { $ref: "#/components/responses/Error" }
        "429":
          description: Too many requests
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/code/verify:
    post:
      tags: [auth]
      summary: Exchange a code for a session token
      description: |
        A wrong code uses one of five attempts. After five wrong attempts the
        code is locked and a new one must be requested. Requesting a new code
        replaces the previous one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string, example: "+12025550100" }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [token, tokenType, expiresAt, userId]
                properties:
                  token: { type: string, description: Opaque bearer token starting with anu_s_ }
                  tokenType: { type: string, const: Bearer }
                  expiresAt: { type: string, format: date-time }
                  userId: { type: string, format: uuid }
        "400":
          description: |
            `invalid_code` (with `attemptsRemaining`), `code_expired`,
            `invalid_phone`, or `invalid_code_format`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session token
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me:
    get:
      tags: [me]
      summary: The signed-in user
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [me]
      summary: Delete the user and all of their data
      description: Stops running tasks, deletes tasks, steps, approvals, sessions, audit entries, and sandbox workspaces.
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/export:
    get:
      tags: [me]
      summary: Export all of the user's data as JSON
      responses:
        "200":
          description: Export
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt: { type: string, format: date-time }
                  user: { $ref: "#/components/schemas/User" }
                  tasks:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Task"
                        - type: object
                          properties:
                            steps: { type: array, items: { $ref: "#/components/schemas/Step" } }
                            approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        createdAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
                        revokedAt: { type: [string, "null"], format: date-time }
                  audit:
                    type: array
                    items:
                      type: object
                      properties:
                        action: { type: string }
                        target: { type: [string, "null"] }
                        detail: {}
                        createdAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/tasks:
    get:
      tags: [tasks]
      summary: List the user's tasks, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tasks]
      summary: Create a task and start it in a sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal]
              properties:
                goal: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201":
          description: Created. Status is `queued`, or `failed` if the sandbox could not start it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      summary: One task with its approvals
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tasks/{taskId}/steps:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      summary: The task's steps in order
      parameters:
        - name: after
          in: query
          description: Return only steps with seq greater than this.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps: { type: array, items: { $ref: "#/components/schemas/Step" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tasks/{taskId}/events:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      summary: Server-sent events for a task until it reaches a final state
      description: |
        Events:
        - `task`: the task with approvals (TaskDetail), sent first and on every change.
        - `step`: one Step. The SSE `id` is the step's `seq`.
        - `end`: `{"status": "<final status>"}` or `{"reason": "deleted"}`. The server closes the stream after it.
        - `error`: `{"message": "..."}` if the stream fails.

        Comment lines (`: ping`) are heartbeats. To resume, pass `after` or
        the `Last-Event-ID` header with the last seq received.
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tasks/{taskId}/stop:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      summary: Stop a task
      description: Marks the task `stopped`, expires pending approvals, and kills its sandbox run. Stopping a finished task returns it unchanged.
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tasks/{taskId}/approvals/{approvalId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
      - name: approvalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [tasks]
      summary: Approve or reject a pending approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        "200":
          description: The decided approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already decided, or the task has finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/tasks/{taskId}/files:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [workspace]
      summary: List a directory of the task workspace
      description: |
        Works while the task runs and after it ends, until the task is deleted.
        Paths are relative to the workspace root. `..` segments, absolute paths
        and symlinks that resolve outside the workspace are refused.
      parameters:
        - name: path
          in: query
          description: Directory relative to the workspace root. Empty or missing means the root.
          schema: { type: string, default: "" }
      responses:
        "200":
          description: Directory listing, directories first, at most 1000 entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryListing" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tasks/{taskId}/files/content:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [workspace]
      summary: Download one file of the task workspace
      description: |
        The content type comes from the file extension. HTML, SVG, XML and
        JavaScript are served as `text/plain` with `nosniff` and a sandbox CSP,
        so workspace files never run in the client's origin. Files over
        20 MB return `413`. Range requests are not supported.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File content
          content:
            "*/*":
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/Error" }

  /v1/tasks/{taskId}/browser:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [workspace]
      summary: The agent's latest browser frames
      description: The last 20 frames are kept per task, newest first. `latest` is null before the first frame.
      responses:
        "200":
          description: Frame metadata
          content:
            application/json:
              schema:
                type: object
                required: [latest, frames]
                properties:
                  latest:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/BrowserFrame" }]
                  frames: { type: array, items: { $ref: "#/components/schemas/BrowserFrame" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tasks/{taskId}/browser/frame:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [workspace]
      summary: One browser frame image
      parameters:
        - name: frameId
          in: query
          required: true
          schema: { type: string, pattern: "^f[0-9]+$" }
      responses:
        "200":
          description: The image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents:
    get:
      tags: [agents]
      summary: The user's agents (one per task and per chat session)
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AgentStatus" }
      responses:
        "200":
          description: Agents, most recently active first
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/sessions:
    post:
      tags: [sessions]
      summary: Create a chat session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
      responses:
        "201":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      tags: [sessions]
      summary: The user's chat sessions, most recently active first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions: { type: array, items: { $ref: "#/components/schemas/ChatSession" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      summary: One chat session with its agent and approvals
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [sessions]
      summary: Delete the session, its agent, and its workspace
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sessions/{sessionId}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      summary: Session items in order
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Items (at most 1000 per call)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SessionItem" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [sessions]
      summary: Send a message and start a turn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 20000 }
      responses:
        "202":
          description: Accepted. The reply arrives as items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  turnId: { type: string, format: uuid }
                  item: { $ref: "#/components/schemas/SessionItem" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      summary: Server-sent events for a session
      description: |
        Events: `session` (ChatSession with approvals, first and on every change),
        `item` (one SessionItem; SSE `id` is its `seq`), `end` (`{"reason": "deleted"}`),
        `error`. The stream stays open between turns. Resume with `after` or `Last-Event-ID`.
      parameters:
        - name: after
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sessions/{sessionId}/stop:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      summary: Stop the current turn
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sessions/{sessionId}/approvals/{approvalId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: approvalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [sessions]
      summary: Approve or reject a pending session approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
      responses:
        "200":
          description: The decided approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/sessions/{sessionId}/files:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      summary: Same as /v1/tasks/{taskId}/files, for the session workspace
      parameters:
        - { name: path, in: query, schema: { type: string } }
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryListing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sessions/{sessionId}/files/content:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      summary: Same as /v1/tasks/{taskId}/files/content
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: File content
          content:
            "*/*": { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sessions/{sessionId}/browser:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      summary: Same as /v1/tasks/{taskId}/browser
      responses:
        "200":
          description: Frame metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  latest: { nullable: true, allOf: [{ $ref: "#/components/schemas/BrowserFrame" }] }
                  frames: { type: array, items: { $ref: "#/components/schemas/BrowserFrame" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/sessions/{sessionId}/browser/frame:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      summary: Same as /v1/tasks/{taskId}/browser/frame
      parameters:
        - { name: frameId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: Session token from /v1/auth/code/verify. Expires after 24 hours by default.
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, expired, or revoked session token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, or owned by another user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            attemptsRemaining: { type: integer }
    User:
      type: object
      required: [id, phone, createdAt]
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        createdAt: { type: string, format: date-time }
    TaskStatus:
      type: string
      enum: [queued, running, awaiting_approval, succeeded, failed, stopped]
    Task:
      type: object
      required: [id, goal, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        goal: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        result: { type: [string, "null"] }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
    Step:
      type: object
      required: [id, taskId, seq, kind, title, detail, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        kind: { type: string, enum: [plan, tool, observation, message, approval_request, result, browser] }
        title: { type: string }
        detail: { description: Free-form JSON that depends on the kind }
        status: { type: string, enum: [pending, running, done, failed] }
        createdAt: { type: string, format: date-time }
    DirectoryListing:
      type: object
      required: [path, entries, truncated]
      properties:
        path: { type: string, description: Normalized directory path, empty for the root }
        truncated: { type: boolean }
        entries:
          type: array
          items:
            type: object
            required: [name, path, type, size, mtime]
            properties:
              name: { type: string }
              path: { type: string, description: Path to pass back as `path` }
              type: { type: string, enum: [file, directory, symlink, other] }
              size: { type: integer, description: Bytes, 0 for non-files }
              mtime: { type: string, format: date-time }
    BrowserFrame:
      type: object
      required: [frameId, seq, url, action, contentType, bytes, capturedAt]
      properties:
        frameId: { type: string, example: f3 }
        seq: { type: integer }
        url: { type: string, nullable: true }
        action: { type: string, example: navigate }
        contentType: { type: string, enum: [image/png, image/jpeg] }
        bytes: { type: integer }
        capturedAt: { type: string, format: date-time }
    AgentStatus:
      type: string
      enum: [working, waiting_for_you, idle, finished, failed]
    Avatar:
      type: object
      required: [bodyShape, eyeStyle, color]
      description: Ids from packages/avatar-catalog.
      properties:
        bodyShape: { type: string, example: stellar }
        eyeStyle: { type: string, example: curious }
        color: { type: string, example: teal }
    AgentSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar: { $ref: "#/components/schemas/Avatar" }
    Agent:
      type: object
      required: [id, name, avatar, kind, status, title, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar: { $ref: "#/components/schemas/Avatar" }
        kind: { type: string, enum: [task, session] }
        taskId: { type: [string, "null"], format: uuid }
        sessionId: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/AgentStatus" }
        sourceStatus: { type: string, description: The task or session status it was derived from }
        title: { type: string, description: Task goal or session title }
        doing: { type: [string, "null"], description: Title of the latest step or message }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChatSession:
      type: object
      required: [id, title, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [idle, working, waiting_for_you, failed] }
        agent: { $ref: "#/components/schemas/AgentSummary" }
        lastItem: { oneOf: [{ $ref: "#/components/schemas/SessionItem" }, { type: "null" }] }
        approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SessionItem:
      type: object
      required: [id, sessionId, seq, kind, title, detail, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        seq: { type: integer }
        kind:
          type: string
          enum: [user_message, assistant_message, plan, tool, observation, message, browser, approval_request, turn_complete]
        title: { type: string }
        text: { type: [string, "null"], description: Full text for user_message and assistant_message }
        detail: {}
        status: { type: string, enum: [pending, running, done, failed] }
        turnId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
    Approval:
      type: object
      required: [id, taskId, prompt, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        taskId: { type: [string, "null"], format: uuid }
        sessionId: { type: [string, "null"], format: uuid, description: Set for chat session approvals }
        stepId: { type: [string, "null"], format: uuid }
        prompt: { type: string }
        detail: {}
        status: { type: string, enum: [pending, approved, rejected, expired] }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, "null"], format: date-time }
